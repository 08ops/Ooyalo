name: ooyalo_app
description: Ooyalo Campus Shuttle Tracker - Real-time shuttle tracking for University of Ghana
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.0.0
  google_maps_flutter: ^2.10.0
  go_router: ^14.0.0
  provider: ^6.1.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  geolocator: ^13.0.0
  intl: ^0.19.0
  cached_network_image: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
